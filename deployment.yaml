apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-equipment-booking
  labels:
    app: campus-equipment-booking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-equipment-booking
  template:
    metadata:
      labels:
        app: campus-equipment-booking
    spec:
      containers:
        - name: campus-equipment-booking
          image: campus-equipment-booking:set-a
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
